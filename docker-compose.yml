services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aidublaj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aidublaj}
      POSTGRES_USER: ${POSTGRES_USER:-aidublaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidublaj}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidublaj} -d ${POSTGRES_DB:-aidublaj}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aidublaj-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    image: python:3.12-slim
    container_name: aidublaj-api-dev
    working_dir: /workspace/apps/api
    command: sh -c "pip install -r requirements/base.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aidublaj}:${POSTGRES_PASSWORD:-aidublaj}@postgres:5432/${POSTGRES_DB:-aidublaj}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /workspace/storage/projects
      PYTHONPATH: /workspace/apps/api
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_SOURCE_LANGUAGE: ${ASR_SOURCE_LANGUAGE:-auto}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-tiny}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-auto}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      TRANSLATION_TARGET_LANGUAGE: ${TRANSLATION_TARGET_LANGUAGE:-tr}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4.1-mini}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      TTS_VOICE_NAME: ${TTS_VOICE_NAME:-default}
      TTS_CLONE_MODE: ${TTS_CLONE_MODE:-auto}
      TTS_DURATION_FIT_ALLOW_REWRITE: ${TTS_DURATION_FIT_ALLOW_REWRITE:-false}
      TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY: ${TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY:-0.72}
      TTS_VOICE_CONVERSION_BASE_PROVIDER: ${TTS_VOICE_CONVERSION_BASE_PROVIDER:-edge_tts}
      TTS_VOICE_CONVERSION_BASE_VOICE: ${TTS_VOICE_CONVERSION_BASE_VOICE:-tr-TR-AhmetNeural}
      VOICE_CLONE_PROVIDER: ${VOICE_CLONE_PROVIDER:-mock}
      VOICE_CONVERSION_PROVIDER: ${VOICE_CONVERSION_PROVIDER:-seedvc}
      LIP_SYNC_PROVIDER: ${LIP_SYNC_PROVIDER:-mock}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      AUDIO_MIX_TRIM_TO_TIMELINE: ${AUDIO_MIX_TRIM_TO_TIMELINE:-false}
      VOICE_CLONE_MIN_SAMPLE_DURATION_MS: ${VOICE_CLONE_MIN_SAMPLE_DURATION_MS:-500}
      MUSETALK_SERVICE_URL: ${MUSETALK_SERVICE_URL:-}
      MUSETALK_SERVICE_TIMEOUT_SECONDS: ${MUSETALK_SERVICE_TIMEOUT_SECONDS:-1800}
      MUSETALK_MODEL_NAME: ${MUSETALK_MODEL_NAME:-MuseTalk}
      MUSETALK_FACE_MODE: ${MUSETALK_FACE_MODE:-auto}
      MUSETALK_FPS: ${MUSETALK_FPS:-}
      MUSETALK_RESOLUTION: ${MUSETALK_RESOLUTION:-source}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-2}
      MUSETALK_PAD_MODE: ${MUSETALK_PAD_MODE:-clone}
      MUSETALK_USE_SOURCE_FPS: ${MUSETALK_USE_SOURCE_FPS:-true}
      MUSETALK_QUALITY_PRESET: ${MUSETALK_QUALITY_PRESET:-source-native}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-tr-TR-AhmetNeural}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-}
      COSYVOICE_MODEL_PATH: ${COSYVOICE_MODEL_PATH:-}
      COSYVOICE_SERVICE_URL: ${COSYVOICE_SERVICE_URL:-}
      COSYVOICE_SERVICE_TIMEOUT_SECONDS: ${COSYVOICE_SERVICE_TIMEOUT_SECONDS:-180}
      COSYVOICE_MODEL_NAME: ${COSYVOICE_MODEL_NAME:-CosyVoice}
      F5TTS_MODEL_PATH: ${F5TTS_MODEL_PATH:-}
      SEEDVC_REPO_DIR: ${SEEDVC_REPO_DIR:-}
      SEEDVC_PYTHON_EXECUTABLE: ${SEEDVC_PYTHON_EXECUTABLE:-/opt/seedvc-venv/bin/python}
      SEEDVC_CHECKPOINT: ${SEEDVC_CHECKPOINT:-}
      SEEDVC_CONFIG: ${SEEDVC_CONFIG:-}
      SEEDVC_DIFFUSION_STEPS: ${SEEDVC_DIFFUSION_STEPS:-25}
      SEEDVC_LENGTH_ADJUST: ${SEEDVC_LENGTH_ADJUST:-1.0}
      SEEDVC_INFERENCE_CFG_RATE: ${SEEDVC_INFERENCE_CFG_RATE:-0.7}
      SEEDVC_FP16: ${SEEDVC_FP16:-true}
      SEEDVC_TIMEOUT_SECONDS: ${SEEDVC_TIMEOUT_SECONDS:-900}
      SEEDVC_CUDA_VISIBLE_DEVICES: ${SEEDVC_CUDA_VISIBLE_DEVICES:-}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-mock}
      PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
      PYANNOTE_PIPELINE_NAME: ${PYANNOTE_PIPELINE_NAME:-pyannote/speaker-diarization-3.1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: node:22-alpine
    container_name: aidublaj-web-dev
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./:/workspace
    depends_on:
      - api

  worker-gpu-0:
    profiles: ["app"]
    build:
      context: .
      dockerfile: workers/gpu/Dockerfile
    container_name: aidublaj-worker-gpu-0-dev
    working_dir: /workspace/workers/gpu
    command: python app/main.py
    gpus: all
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aidublaj}:${POSTGRES_PASSWORD:-aidublaj}@postgres:5432/${POSTGRES_DB:-aidublaj}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /workspace/storage/projects
      WORKER_NAME: worker-gpu-0
      GPU_DEVICE_ID: 0
      PYTHONPATH: /workspace/apps/api:/workspace/workers/gpu
      LD_LIBRARY_PATH: /usr/local/lib/python3.12/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.12/site-packages/nvidia/cudnn/lib
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_SOURCE_LANGUAGE: ${ASR_SOURCE_LANGUAGE:-auto}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-tiny}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-auto}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      TRANSLATION_TARGET_LANGUAGE: ${TRANSLATION_TARGET_LANGUAGE:-tr}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4.1-mini}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      TTS_VOICE_NAME: ${TTS_VOICE_NAME:-default}
      TTS_CLONE_MODE: ${TTS_CLONE_MODE:-auto}
      TTS_DURATION_FIT_ALLOW_REWRITE: ${TTS_DURATION_FIT_ALLOW_REWRITE:-false}
      TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY: ${TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY:-0.72}
      TTS_VOICE_CONVERSION_BASE_PROVIDER: ${TTS_VOICE_CONVERSION_BASE_PROVIDER:-edge_tts}
      TTS_VOICE_CONVERSION_BASE_VOICE: ${TTS_VOICE_CONVERSION_BASE_VOICE:-tr-TR-AhmetNeural}
      VOICE_CLONE_PROVIDER: ${VOICE_CLONE_PROVIDER:-mock}
      VOICE_CONVERSION_PROVIDER: ${VOICE_CONVERSION_PROVIDER:-seedvc}
      LIP_SYNC_PROVIDER: ${LIP_SYNC_PROVIDER:-mock}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      AUDIO_MIX_TRIM_TO_TIMELINE: ${AUDIO_MIX_TRIM_TO_TIMELINE:-false}
      VOICE_CLONE_MIN_SAMPLE_DURATION_MS: ${VOICE_CLONE_MIN_SAMPLE_DURATION_MS:-500}
      MUSETALK_SERVICE_URL: ${MUSETALK_SERVICE_URL:-}
      MUSETALK_SERVICE_TIMEOUT_SECONDS: ${MUSETALK_SERVICE_TIMEOUT_SECONDS:-1800}
      MUSETALK_MODEL_NAME: ${MUSETALK_MODEL_NAME:-MuseTalk}
      MUSETALK_FACE_MODE: ${MUSETALK_FACE_MODE:-auto}
      MUSETALK_FPS: ${MUSETALK_FPS:-}
      MUSETALK_RESOLUTION: ${MUSETALK_RESOLUTION:-source}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-2}
      MUSETALK_PAD_MODE: ${MUSETALK_PAD_MODE:-clone}
      MUSETALK_USE_SOURCE_FPS: ${MUSETALK_USE_SOURCE_FPS:-true}
      MUSETALK_QUALITY_PRESET: ${MUSETALK_QUALITY_PRESET:-source-native}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-tr-TR-AhmetNeural}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-}
      COSYVOICE_MODEL_PATH: ${COSYVOICE_MODEL_PATH:-}
      COSYVOICE_SERVICE_URL: ${COSYVOICE_SERVICE_URL:-}
      COSYVOICE_SERVICE_TIMEOUT_SECONDS: ${COSYVOICE_SERVICE_TIMEOUT_SECONDS:-180}
      COSYVOICE_MODEL_NAME: ${COSYVOICE_MODEL_NAME:-CosyVoice}
      F5TTS_MODEL_PATH: ${F5TTS_MODEL_PATH:-}
      SEEDVC_REPO_DIR: ${SEEDVC_REPO_DIR:-}
      SEEDVC_PYTHON_EXECUTABLE: ${SEEDVC_PYTHON_EXECUTABLE:-/opt/seedvc-venv/bin/python}
      SEEDVC_CHECKPOINT: ${SEEDVC_CHECKPOINT:-}
      SEEDVC_CONFIG: ${SEEDVC_CONFIG:-}
      SEEDVC_DIFFUSION_STEPS: ${SEEDVC_DIFFUSION_STEPS:-25}
      SEEDVC_LENGTH_ADJUST: ${SEEDVC_LENGTH_ADJUST:-1.0}
      SEEDVC_INFERENCE_CFG_RATE: ${SEEDVC_INFERENCE_CFG_RATE:-0.7}
      SEEDVC_FP16: ${SEEDVC_FP16:-true}
      SEEDVC_TIMEOUT_SECONDS: ${SEEDVC_TIMEOUT_SECONDS:-900}
      SEEDVC_CUDA_VISIBLE_DEVICES: ${SEEDVC_CUDA_VISIBLE_DEVICES:-}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-mock}
      PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
      PYANNOTE_PIPELINE_NAME: ${PYANNOTE_PIPELINE_NAME:-pyannote/speaker-diarization-3.1}
      HF_HOME: /cache/huggingface
    volumes:
      - ./:/workspace
      - huggingface_cache:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-media:
    profiles: ["app"]
    image: python:3.12-slim
    container_name: aidublaj-worker-media-dev
    working_dir: /workspace/workers/media
    command: sh -c "apt-get update && apt-get install -y ffmpeg && pip install -r /workspace/apps/api/requirements/base.txt && python app/main.py"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aidublaj}:${POSTGRES_PASSWORD:-aidublaj}@postgres:5432/${POSTGRES_DB:-aidublaj}
      REDIS_URL: redis://redis:6379/1
      STORAGE_ROOT: /workspace/storage/projects
      WORKER_NAME: worker-media
      PYTHONPATH: /workspace/apps/api:/workspace/workers/media
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_SOURCE_LANGUAGE: ${ASR_SOURCE_LANGUAGE:-auto}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-tiny}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-auto}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-mock}
      TRANSLATION_TARGET_LANGUAGE: ${TRANSLATION_TARGET_LANGUAGE:-tr}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4.1-mini}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      TTS_VOICE_NAME: ${TTS_VOICE_NAME:-default}
      TTS_DURATION_FIT_ALLOW_REWRITE: ${TTS_DURATION_FIT_ALLOW_REWRITE:-false}
      TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY: ${TTS_DURATION_FIT_MIN_SEMANTIC_SIMILARITY:-0.72}
      VOICE_CLONE_PROVIDER: ${VOICE_CLONE_PROVIDER:-mock}
      LIP_SYNC_PROVIDER: ${LIP_SYNC_PROVIDER:-mock}
      ALLOW_MOCK_PROVIDERS: ${ALLOW_MOCK_PROVIDERS:-false}
      AUDIO_MIX_TRIM_TO_TIMELINE: ${AUDIO_MIX_TRIM_TO_TIMELINE:-false}
      VOICE_CLONE_MIN_SAMPLE_DURATION_MS: ${VOICE_CLONE_MIN_SAMPLE_DURATION_MS:-500}
      MUSETALK_SERVICE_URL: ${MUSETALK_SERVICE_URL:-}
      MUSETALK_SERVICE_TIMEOUT_SECONDS: ${MUSETALK_SERVICE_TIMEOUT_SECONDS:-1800}
      MUSETALK_MODEL_NAME: ${MUSETALK_MODEL_NAME:-MuseTalk}
      MUSETALK_FACE_MODE: ${MUSETALK_FACE_MODE:-auto}
      MUSETALK_FPS: ${MUSETALK_FPS:-}
      MUSETALK_RESOLUTION: ${MUSETALK_RESOLUTION:-source}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-2}
      MUSETALK_PAD_MODE: ${MUSETALK_PAD_MODE:-clone}
      MUSETALK_USE_SOURCE_FPS: ${MUSETALK_USE_SOURCE_FPS:-true}
      MUSETALK_QUALITY_PRESET: ${MUSETALK_QUALITY_PRESET:-source-native}
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-tr-TR-AhmetNeural}
      PIPER_MODEL_PATH: ${PIPER_MODEL_PATH:-}
      COSYVOICE_MODEL_PATH: ${COSYVOICE_MODEL_PATH:-}
      COSYVOICE_SERVICE_URL: ${COSYVOICE_SERVICE_URL:-}
      COSYVOICE_SERVICE_TIMEOUT_SECONDS: ${COSYVOICE_SERVICE_TIMEOUT_SECONDS:-180}
      COSYVOICE_MODEL_NAME: ${COSYVOICE_MODEL_NAME:-CosyVoice}
      F5TTS_MODEL_PATH: ${F5TTS_MODEL_PATH:-}
      SEEDVC_REPO_DIR: ${SEEDVC_REPO_DIR:-}
      SEEDVC_PYTHON_EXECUTABLE: ${SEEDVC_PYTHON_EXECUTABLE:-/opt/seedvc-venv/bin/python}
      SEEDVC_CHECKPOINT: ${SEEDVC_CHECKPOINT:-}
      SEEDVC_CONFIG: ${SEEDVC_CONFIG:-}
      SEEDVC_DIFFUSION_STEPS: ${SEEDVC_DIFFUSION_STEPS:-25}
      SEEDVC_LENGTH_ADJUST: ${SEEDVC_LENGTH_ADJUST:-1.0}
      SEEDVC_INFERENCE_CFG_RATE: ${SEEDVC_INFERENCE_CFG_RATE:-0.7}
      SEEDVC_FP16: ${SEEDVC_FP16:-true}
      SEEDVC_TIMEOUT_SECONDS: ${SEEDVC_TIMEOUT_SECONDS:-900}
      SEEDVC_CUDA_VISIBLE_DEVICES: ${SEEDVC_CUDA_VISIBLE_DEVICES:-}
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-mock}
      PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
      PYANNOTE_PIPELINE_NAME: ${PYANNOTE_PIPELINE_NAME:-pyannote/speaker-diarization-3.1}
      HF_HOME: /cache/huggingface
    volumes:
      - ./:/workspace
      - huggingface_cache:/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cosyvoice-service:
    profiles: ["cosyvoice"]
    build:
      context: .
      dockerfile: services/cosyvoice/Dockerfile
    container_name: aidublaj-cosyvoice-service
    working_dir: /workspace/services/cosyvoice
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"
    environment:
      COSYVOICE_MODEL_NAME: ${COSYVOICE_MODEL_NAME:-CosyVoice}
      COSYVOICE_SYNTH_COMMAND: ${COSYVOICE_SYNTH_COMMAND:-}
      COSYVOICE_BOOTSTRAP: ${COSYVOICE_BOOTSTRAP:-0}
      COSYVOICE_REPO_URL: ${COSYVOICE_REPO_URL:-https://github.com/FunAudioLLM/CosyVoice.git}
      COSYVOICE_REPO_DIR: ${COSYVOICE_REPO_DIR:-/opt/cosyvoice/CosyVoice}
      COSYVOICE_MODEL_ID: ${COSYVOICE_MODEL_ID:-}
      COSYVOICE_MODEL_DIR: ${COSYVOICE_MODEL_DIR:-/models/CosyVoice-300M}
      COSYVOICE_DEVICE: ${COSYVOICE_DEVICE:-auto}
      COSYVOICE_INSTALL_MODE: ${COSYVOICE_INSTALL_MODE:-minimal}
      HF_HOME: /cache/huggingface
    ports:
      - "8010:8010"
    gpus: all
    volumes:
      - ./:/workspace
      - cosyvoice_runtime:/opt/cosyvoice
      - cosyvoice_models:/models
      - huggingface_cache:/cache/huggingface

  musetalk-service:
    profiles: ["musetalk"]
    build:
      context: .
      dockerfile: services/musetalk/Dockerfile
    container_name: aidublaj-musetalk-service
    working_dir: /workspace/services/musetalk
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8020 --reload"
    environment:
      MUSETALK_MODEL_NAME: ${MUSETALK_MODEL_NAME:-MuseTalk}
      MUSETALK_RENDER_COMMAND: ${MUSETALK_RENDER_COMMAND:-}
      MUSETALK_BOOTSTRAP: ${MUSETALK_BOOTSTRAP:-0}
      MUSETALK_REPO_URL: ${MUSETALK_REPO_URL:-https://github.com/TMElyralab/MuseTalk.git}
      MUSETALK_REPO_DIR: ${MUSETALK_REPO_DIR:-/opt/musetalk/MuseTalk}
      MUSETALK_MODEL_DIR: ${MUSETALK_MODEL_DIR:-/opt/musetalk/MuseTalk/models}
      MUSETALK_DEVICE: ${MUSETALK_DEVICE:-auto}
      MUSETALK_INSTALL_MODE: ${MUSETALK_INSTALL_MODE:-minimal}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-2}
      MUSETALK_USE_FLOAT16: ${MUSETALK_USE_FLOAT16:-}
      MUSETALK_MAX_WIDTH: ${MUSETALK_MAX_WIDTH:-}
      MUSETALK_FACE_MODE: ${MUSETALK_FACE_MODE:-auto}
      MUSETALK_FPS: ${MUSETALK_FPS:-}
      MUSETALK_RESOLUTION: ${MUSETALK_RESOLUTION:-source}
      MUSETALK_PAD_MODE: ${MUSETALK_PAD_MODE:-clone}
      MUSETALK_USE_SOURCE_FPS: ${MUSETALK_USE_SOURCE_FPS:-true}
      MUSETALK_QUALITY_PRESET: ${MUSETALK_QUALITY_PRESET:-source-native}
      MUSETALK_CHUNK_MODE: ${MUSETALK_CHUNK_MODE:-enabled}
      MUSETALK_CHUNK_SECONDS: ${MUSETALK_CHUNK_SECONDS:-2.5}
      MUSETALK_CHUNK_OVERLAP_MS: ${MUSETALK_CHUNK_OVERLAP_MS:-160}
      HF_HOME: /cache/huggingface
    ports:
      - "8020:8020"
    gpus: all
    volumes:
      - ./:/workspace
      - musetalk_runtime:/opt/musetalk
      - huggingface_cache:/cache/huggingface

volumes:
  postgres_data:
  redis_data:
  cosyvoice_runtime:
  cosyvoice_models:
  musetalk_runtime:
  huggingface_cache:
